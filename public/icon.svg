<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#0f172a"/>
  <!-- Blueprint grid background -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#grid)"/>
  
  <!-- Architectural blueprint room outline -->
  <path d="M 112 128 L 400 128 L 400 384 L 112 384 Z" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Interior partition wall -->
  <line x1="256" y1="128" x2="256" y2="384" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Door swing arc -->
  <path d="M 256 220 A 48 48 0 0 1 304 268" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="6,4"/>
  <line x1="256" y1="268" x2="256" y2="220" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Window symbol -->
  <line x1="160" y1="128" x2="208" y2="128" stroke="#ffffff" stroke-width="18"/>
  <line x1="160" y1="128" x2="208" y2="128" stroke="#0284c7" stroke-width="8"/>

  <!-- Compass / Draft marker -->
  <circle cx="340" cy="184" r="24" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <line x1="340" y1="166" x2="340" y2="202" stroke="#38bdf8" stroke-width="4"/>
  <line x1="322" y1="184" x2="358" y2="184" stroke="#38bdf8" stroke-width="4"/>

  <!-- Dimension line -->
  <line x1="112" y1="416" x2="400" y2="416" stroke="#94a3b8" stroke-width="3"/>
  <line x1="112" y1="406" x2="112" y2="426" stroke="#94a3b8" stroke-width="3"/>
  <line x1="400" y1="406" x2="400" y2="426" stroke="#94a3b8" stroke-width="3"/>
  <text x="256" y="442" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">24' 0"</text>
</svg>
